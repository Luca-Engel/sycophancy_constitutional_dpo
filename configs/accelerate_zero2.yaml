# Accelerate launch config for the Day-2 2-GPU DeepSpeed ZeRO-2 training
# demo (`accelerate config`-style YAML). References configs/deepspeed_zero2.json
# for the actual ZeRO optimizer settings.
#
# Invoke with:
#   accelerate launch --config_file configs/accelerate_zero2.yaml \
#       scripts/train_dpo.py --config configs/train_condition_c.yaml
#
# (set use_deepspeed: true in the training config too, so train_dpo.py passes
# the deepspeed config path through to TrainingArguments)

compute_environment: LOCAL_MACHINE
distributed_type: DEEPSPEED
deepspeed_config:
  deepspeed_config_file: configs/deepspeed_zero2.json
  zero3_init_flag: false
downcast_bf16: "no"
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 2
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
