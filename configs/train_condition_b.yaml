# DPO/LoRA training config -- Condition B (plain-preference control).
#
# Trains on data/preference_pairs/condition_b.jsonl, where the judge picked
# the winning response on generic helpfulness/correctness alone -- no
# constitution, no pushback/sycophancy framing. Identical hyperparameters to
# configs/train_condition_c.yaml so that any eval difference between B and C
# isolates the *constitutional* signal, not a confound from training setup.
#
# Run (Day 2, on a rented GPU box, after `uv sync --extra train`):
#   uv run scripts/train_dpo.py --config configs/train_condition_b.yaml
#
# Local smoke test (tiny model, tiny synthetic data, 1 step, no GPU):
#   uv run scripts/train_dpo.py --config configs/train_condition_b.yaml --smoke-test

base_model: "Qwen/Qwen2.5-3B-Instruct"
dataset_path: "data/preference_pairs/condition_b.jsonl"
output_dir: "outputs/dpo_condition_b"

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

learning_rate: 5.0e-5
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
num_train_epochs: 2
max_steps: -1
beta: 0.1
precision: "bf16"

# Set use_deepspeed: true and launch via
# `accelerate launch --config_file configs/accelerate_zero2.yaml scripts/train_dpo.py --config configs/train_condition_b.yaml`
# for the 2-GPU ZeRO-2 demo. Left off by default for a single-GPU run.
use_deepspeed: false
deepspeed_config_path: "configs/deepspeed_zero2.json"

seed: 42
logging_steps: 10
save_strategy: "epoch"
